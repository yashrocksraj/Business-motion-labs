name: Build check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            grep -nE "rror|failed|Failed" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
